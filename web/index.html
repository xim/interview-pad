<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>interview-pad</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <section id="landing" hidden>
    <h1>interview-pad</h1>
    <form id="join-form">
      <input name="name" placeholder="Your name" maxlength="40" required autofocus>
      <button>Join</button>
    </form>
    <details>
      <summary>Interviewer login</summary>
      <form id="login-form">
        <input name="name" placeholder="Your name (optional)" maxlength="40">
        <input name="password" type="password" placeholder="Password" required>
        <button>Log in</button>
      </form>
    </details>
    <p id="landing-error" class="error"></p>
  </section>

  <section id="waiting" hidden>
    <p id="waiting-text"></p>
  </section>

  <section id="pad" hidden>
    <dialog id="requests-dialog">
      <h2>Join requests</h2>
      <div id="requests"></div>
    </dialog>
    <dialog id="settings-dialog">
      <h2>Settings <small>(just for you)</small></h2>
      <label>Vim bindings <input id="vim" type="checkbox"></label>
      <label>Completion suggestions <input id="completion" type="checkbox"></label>
      <label>Inlay hints <input id="inlay-hints" type="checkbox"></label>
      <label>Editor theme <select id="theme"></select></label>
      <form method="dialog"><button>Close</button></form>
    </dialog>
    <div id="request-banners"></div>
    <div id="offline" hidden>Disconnected from the server: changes are not being shared. Reconnecting…</div>
    <main>
      <div id="left">
        <header class="bar">
          <select id="lang"></select>
          <input id="flags" spellcheck="false" title="Compiler flags (shared)">
          <button id="run" title="Ctrl+Enter">Run</button>
          <button id="stop" hidden>Stop</button>
          <span id="lsp-status"></span>
          <span id="participants"></span>
          <button id="settings" class="secondary" title="Settings">⚙</button>
        </header>
        <div id="editor"></div>
        <div id="vim-status" hidden></div>
      </div>
      <div id="splitter"></div>
      <div id="right">
        <header class="bar">
          <button class="tab" data-tab="output">Output</button>
          <button class="tab" data-tab="input" title="Program arguments and stdin (shared)">Input</button>
          <span id="run-status"></span>
          <button id="end" class="secondary" hidden>End interview</button>
        </header>
        <pre id="output" class="pane"></pre>
        <div id="input" class="pane">
          <label>Arguments <input id="args" spellcheck="false" placeholder='e.g. 42 "two words"'></label>
          <label class="grow">stdin <textarea id="stdin" spellcheck="false"></textarea></label>
          <small>Shared, used on every run.</small>
        </div>
      </div>
    </main>
  </section>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
